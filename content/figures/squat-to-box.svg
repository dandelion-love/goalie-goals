<svg xmlns="http://www.w3.org/2000/svg" id="motion" viewBox="0 0 360 200" width="360" height="200" role="img" aria-labelledby="title">
  <title id="title">Squat to box: stand tall, reach forward, touch the box lightly, then stand</title>
  <style>
    .animated { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      svg:target .still { display: none; }
      svg:target .animated { opacity: 1; }
      .lower { animation: pose 4s steps(1, end) infinite; }
      .stand { animation: start-pose 4s steps(1, end) infinite; }
      @keyframes pose { 0%, 100% { opacity: 0; } 65%, 85% { opacity: 1; } }
      @keyframes start-pose { 0%, 100% { opacity: 1; } 65%, 85% { opacity: 0; } }
    }
  </style>
  <g class="still">
    <g transform="translate(0 47) scale(.49)">
      <line x1="8" y1="186" x2="352" y2="186" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/><rect x="150" y="146" width="38" height="40" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
      <g fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="220" cy="40" r="11"/><line x1="220" y1="56" x2="220" y2="112"/><polyline points="220,112 223,149 220,184"/><polyline points="220,56 238,80 252,92"/></g>
    </g>
    <g transform="translate(180 47) scale(.49)">
      <line x1="8" y1="186" x2="352" y2="186" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/><rect x="150" y="146" width="38" height="40" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
      <g fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="229" cy="70" r="11"/><line x1="221" y1="86" x2="190" y2="143"/><polyline points="190,143 230,140 225,184"/><polyline points="221,86 246,93 270,94"/></g>
    </g>
    <g fill="#374151" font-family="sans-serif" font-size="13" text-anchor="middle"><text x="88" y="170">Stand tall</text><text x="268" y="170">Touch the box</text></g>
  </g>
  <g class="animated">
    <line x1="8" y1="186" x2="352" y2="186" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/><rect x="150" y="146" width="38" height="40" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
    <g class="stand" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="220" cy="40" r="11"/><line x1="220" y1="56" x2="220" y2="112"/><polyline points="220,112 223,149 220,184"/><polyline points="220,56 238,80 252,92"/></g>
    <g class="lower" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><circle cx="229" cy="70" r="11"/><line x1="221" y1="86" x2="190" y2="143"/><polyline points="190,143 230,140 225,184"/><polyline points="221,86 246,93 270,94"/></g>
  </g>
</svg>
